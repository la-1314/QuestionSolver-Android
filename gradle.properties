# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true

# Proxy (sandbox uses local HTTP proxy for outbound)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
# MIUIX 0.9.2 AAR metadata 声明 minCompileSdk=37，但 Google SDK 仅发布到 android-36。
# 暂时跳过 AAR metadata 检查以解除构建阻塞；运行时 API 36/37 差异极小。
android.disableAarMetadataCheck=true

# Kotlin
kotlin.code.style=official
