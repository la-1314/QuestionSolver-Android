name: Build Debug APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.4'

      - name: Strip sandbox-only configs (proxy + Aliyun mirrors)
        run: |
          sed -i '/systemProp\.http\.proxy/d; /systemProp\.https\.proxy/d' gradle.properties || true
          sed -i '\#maven\.aliyun\.com#d' settings.gradle.kts || true
          sed -i '\#maven\.aliyun\.com#d' build.gradle.kts || true
          echo "==== gradle.properties ===="; cat gradle.properties
          echo "==== settings.gradle.kts ===="; cat settings.gradle.kts
          echo "==== build.gradle.kts ===="; cat build.gradle.kts

      - name: Show gradle version
        run: gradle --version

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build-output.log

      - name: Report build error as annotations
        if: failure()
        run: |
          grep -nE 'FAILURE:|^e: |error:|> Task.*FAILED|What went wrong|Caused by:' /tmp/build-output.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "===== LAST 20 LINES ====="
          tail -20 /tmp/build-output.log | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Rename APK with version + commit short sha
        id: apk
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | awk -F'/' '{print $2}')
          TS=$(date -u +'%Y%m%d_%H%M%S')
          VERSION=$(grep -E '^\s*versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          [ -z "$VERSION" ] && VERSION="unknown"
          NEW_NAME="${REPO_NAME}-v${VERSION}-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${NEW_NAME}"
          echo "apk_path=app/build/outputs/apk/debug/${NEW_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${NEW_NAME}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "ts=${TS}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate changelog from commits
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            LOGS=$(git log --pretty=format:"- %s" "${LAST_TAG}..HEAD" 2>/dev/null | head -30)
          else
            LOGS=$(git log --pretty=format:"- %s" -n 20)
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "logs<<${EOF}" >> $GITHUB_OUTPUT
          echo "${LOGS}" >> $GITHUB_OUTPUT
          echo "${EOF}" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuestionSolver-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or update tag for release
        id: tag
        run: |
          TAG="v${{ steps.apk.outputs.version }}-${{ steps.apk.outputs.ts }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "QuestionSolver v${{ steps.apk.outputs.version }} (${{ steps.apk.outputs.short_sha }})"
          body: |
            # QuestionSolver v${{ steps.apk.outputs.version }}

            - 版本号: v${{ steps.apk.outputs.version }}
            - 提交: ${{ github.sha }}
            - 分支: ${{ github.ref_name }}
            - 构建时间: ${{ steps.apk.outputs.ts }}
            - 触发者: ${{ github.actor }}

            ## 更新日志

            ${{ steps.changelog.outputs.logs }}

            ## 下载
            下方 Assets 中的 `.apk` 文件可直接 `adb install` 安装到 Android 7.0+ 设备。

            ## 完整构建日志
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          prerelease: false
          files: ${{ steps.apk.outputs.apk_path }}
          fail_on_unmatched_files: true

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            build/reports/
          retention-days: 7
          if-no-files-found: ignore
