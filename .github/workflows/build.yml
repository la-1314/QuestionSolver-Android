name: Build Debug APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Strip sandbox-only configs (proxy + Aliyun mirrors)
        run: |
          # 1) 删除沙箱专用代理（127.0.0.1:18080 仅在开发沙箱可用）
          sed -i '/systemProp\.http\.proxy/d; /systemProp\.https\.proxy/d' gradle.properties || true
          # 2) 删除阿里云镜像（CI 在美西，直连 mavenCentral()/google() 更快更稳）
          sed -i '\#maven\.aliyun\.com#d' settings.gradle.kts || true
          sed -i '\#maven\.aliyun\.com#d' build.gradle.kts || true
          echo "==== gradle.properties ===="; cat gradle.properties
          echo "==== settings.gradle.kts ===="; cat settings.gradle.kts
          echo "==== build.gradle.kts ===="; cat build.gradle.kts

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Show gradle version
        run: gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuestionSolver-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            build/reports/
          retention-days: 7
          if-no-files-found: ignore
